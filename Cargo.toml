[package]
name = "lottery"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "双色球历史数据分析与号码预测"
license = "GPL-3.0-or-later"

[lib]
name = "lottery_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lottery"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", features = ["backend-android-activity-06"] }
slint-kit = "0.7.2"
boa_engine = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
regex = "1"
dirs = "7"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "native-tls"] }
arboard = "3"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls-webpki-roots"] }

[build-dependencies]
slint-kit-build = "0.7.2"

[package.metadata.android]
package = "dev.lkq.lottery"
apk_name = "lottery"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35
